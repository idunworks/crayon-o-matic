<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crayon-o-matic · preview</title>
<style>
	* { box-sizing: border-box; }
	body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #222; background: #efece4; display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
	aside { padding: 18px; background: #fff; border-right: 1px solid #ddd; overflow-y: auto; max-height: 100vh; }
	h1 { font-size: 18px; margin: 0 0 4px; }
	.note { color: #777; font-size: 12px; margin: 0 0 14px; }
	fieldset { border: 0; border-top: 1px solid #eee; padding: 10px 0 4px; margin: 0; }
	legend { font-weight: 700; padding: 0 0 4px; }
	label { display: grid; grid-template-columns: 96px 1fr 42px; gap: 8px; align-items: center; margin: 6px 0; }
	label.wide { grid-template-columns: 96px 1fr; }
	output { font-variant-numeric: tabular-nums; text-align: right; color: #555; }
	input[type='text'] { width: 100%; padding: 6px 8px; font: inherit; }
	button { font: inherit; padding: 6px 10px; margin: 8px 6px 0 0; cursor: pointer; }
	main { display: grid; place-items: center; padding: 24px; }
	#paper { width: min(66vh, 100%); aspect-ratio: 3 / 4; background: #fbf8f1; box-shadow: 0 2px 14px rgba(0,0,0,.12); }
	#paper svg { width: 100%; height: 100%; display: block; }
	#says { margin-top: 12px; font-style: italic; color: #555; min-height: 1.4em; }
	.modes { display: flex; gap: 14px; margin: 0 0 10px; }
	.modes label { display: flex; gap: 6px; margin: 0; }
	body.freehand .motif-only, body:not(.freehand) .freehand-only { display: none; }
	body.freehand #paper { cursor: crosshair; touch-action: none; }
</style>
</head>
<body>
<aside>
	<h1>Crayon-o-matic</h1>
	<p class="note">Dev preview: drag a slider, the drawing redraws. Offline motifs only (phase 1).</p>
	<div class="modes" role="radiogroup" aria-label="Mode">
		<label><input type="radio" name="mode" value="motif" checked /> motif</label>
		<label><input type="radio" name="mode" value="freehand" /> freehand</label>
	</div>
	<label class="wide motif-only">motif <input id="motif" type="text" value="a furious grandma with a cat" /></label>
	<div class="freehand-only">
		<p class="note">Draw on the paper. Kid-ify 0 keeps your lines exactly; raise it to hand them to a child of the age below.</p>
		<label>kid-ify <input id="kidify" type="range" min="0" max="1" step="0.05" value="0" /><output></output></label>
		<button id="undo" type="button">Undo stroke</button>
		<button id="clear" type="button">Clear</button>
	</div>
	<fieldset><legend>Child</legend>
		<label>age <input id="age" type="range" min="2.5" max="6" step="0.1" value="5" /><output></output></label>
		<label>shaky <input id="shakiness" type="range" min="0" max="1" step="0.05" value="0.5" title="0 straight · 0.5 typical for the age · 1 a mess" /><output></output></label>
		<label class="motif-only">attention <input id="attention" type="range" min="0" max="1" step="0.05" value="0.6" /><output></output></label>
		<label class="motif-only">chaos <input id="chaos" type="range" min="0" max="1" step="0.05" value="0.3" /><output></output></label>
		<label class="motif-only">adorable <input id="adorable" type="range" min="0" max="1" step="0.05" value="0.5" /><output></output></label>
		<label>seed <input id="seed" type="range" min="1" max="200" step="1" value="1" /><output></output></label>
	</fieldset>
	<fieldset><legend>Colours</legend>
		<label class="wide">lines <input id="line" type="color" value="#232323" /></label>
		<label class="wide">shadow <span><input id="shadowOn" type="checkbox" checked /> <input id="shadow" type="color" value="#c8c2b4" /></span></label>
		<label class="wide">highlight <span><input id="highlightOn" type="checkbox" checked /> <input id="highlight" type="color" value="#f4c430" /></span></label>
	</fieldset>
	<fieldset><legend>Shadow</legend>
		<label>angle <input id="shadowAngle" type="range" min="0" max="360" step="5" value="50" /><output></output></label>
		<label>length <input id="shadowLength" type="range" min="0" max="30" step="0.5" value="9" /><output></output></label>
		<label>cut <input id="shadowCut" type="range" min="0" max="1" step="0.05" value="0.6" /><output></output></label>
	</fieldset>
	<fieldset><legend>Highlight</legend>
		<label>angle <input id="highlightAngle" type="range" min="0" max="360" step="5" value="230" /><output></output></label>
		<label>length <input id="highlightLength" type="range" min="0" max="30" step="0.5" value="4" /><output></output></label>
		<label>cut <input id="highlightCut" type="range" min="0" max="1" step="0.05" value="0.6" /><output></output></label>
	</fieldset>
	<button id="again" type="button">Ask again (new seed)</button>
	<button id="save" type="button">Download SVG</button>
</aside>
<main>
	<div>
		<div id="paper" role="img" aria-label="The drawing"></div>
		<p id="says"></p>
	</div>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
